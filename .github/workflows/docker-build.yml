name: nginx
on:
  push:
    branches: main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build dockerfile
        run: docker build -t docker-practice:1.0 .

      - name: verify docker images
        run: docker images
      - name: verify specific docker images
        run: docker image inspect docker-practice:1.0

      - name: run docker images
        run: docker run -d -p 8080:80 --name nginx-test docker-practice:1.0 

      - name: verify docker images
        run: docker logs nginx-test
    
